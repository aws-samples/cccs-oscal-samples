name: Validate OSCAL content

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements.txt
      - name: Install checksum-verified OSCAL CLI 3.2.0
        shell: python
        run: |
          import hashlib
          import io
          import os
          import urllib.request
          import zipfile
          from pathlib import Path
          url = "https://repo.maven.apache.org/maven2/dev/metaschema/oscal/oscal-cli-enhanced/3.2.0/oscal-cli-enhanced-3.2.0-oscal-cli.zip"
          payload = urllib.request.urlopen(url).read()
          checksum = urllib.request.urlopen(url + ".sha256").read().decode().strip()
          if hashlib.sha256(payload).hexdigest() != checksum:
              raise ValueError("OSCAL CLI checksum mismatch")
          target = Path(".cache/oscal-cli")
          zipfile.ZipFile(io.BytesIO(payload)).extractall(target)
          executable = target / "bin" / ("oscal-cli.bat" if os.name == "nt" else "oscal-cli")
          executable.chmod(0o755)
          with open(os.environ["GITHUB_PATH"], "a") as stream:
              stream.write(str(executable.parent.resolve()) + "\n")
      - run: python scripts/build-catalog.py --check
      - run: python scripts/resolve.py --check
      - run: python -m unittest discover -s tests -v
